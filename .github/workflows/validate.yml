name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile the MCP bridge
        run: python -m compileall -q plugins/botnest/scripts
      - name: Validate package and behavior
        run: python -m unittest discover -s tests -v
      - name: Build the review archive
        run: python scripts/build_package.py
