services:
  webhook:
    build:
      context: ../..
      dockerfile: adapters/alice/Dockerfile
    image: botnest-alice:${BOTNEST_ALICE_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      default:
        aliases:
          - botnest-alice
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    external: true
    name: ${NETWORK_NAME:-botnest-net}
